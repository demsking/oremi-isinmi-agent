[project]
name = "oremi-isinmi-agent"
version = "1.0.0"
description = "Encrypted alerts, reminders, scheduling, tags, SSE, and natural language agent API."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "alembic>=1.16.0",
  "fastapi-mcp>=0.4.0",
  "fastapi[standard]>=0.115.0",
  "ollama>=0.5.0",
  "pydantic>=2.11.0",
  "pydantic-ai>=0.4.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "sqlcipher3>=0.5.4",
  "sqlalchemy>=2.0.51",
  "sse-starlette>=2.3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isinmi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]
