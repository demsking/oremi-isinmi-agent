[project]
name = "oremi-isinmi"
version = "1.0.0b1"
description = "Encrypted reminders, scheduling, tags, SSE and MCP."
authors = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
maintainers = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"

keywords = [
  "mcp",
  "ai",
  "api",
  "calendar",
  "encryption",
  "events",
  "fastapi",
  "notifications",
  "oremi",
  "reminders",
  "scheduler",
  "scheduling",
  "server-sent-events",
  "sse",
  "tags",
  "task-management",
]

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "alembic>=1.16.0",
  "mcp>=1.28.1",
  "fastapi[standard]>=0.115.0",
  "httpx>=0.28.0",
  "ollama>=0.5.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "sqlcipher3>=0.5.4",
  "sqlalchemy>=2.0.51",
  "sse-starlette>=3.4.5",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/oremi-isinmi"
"Source" = "https://gitlab.com/demsking/oremi-isinmi"
"Issues" = "https://gitlab.com/demsking/oremi-isinmi/-/issues"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isinmi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]
